concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: validate-${{ github.ref }}
jobs:
  validate:
    name: Validate app
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-and-install
        with:
          # The Homey runtime version; the family action defaults to lts/*.
          node-version: '22'
          # The install pulls @olivierzal/configs and @olivierzal/heatzy-api
          # from GitHub Packages, which requires auth even for read.
          npm-token: ${{ secrets.GITHUB_TOKEN }}
          registry-url: https://npm.pkg.github.com
          require-npm-token: 'true'
          scope: '@olivierzal'
      - name: Validate app
        uses: athombv/github-action-homey-app-validate@0f3b42c15d26aab79d7c48cde4d2805524da910e # untagged: master carries the `don't npm ci` fix the @typescript/native toolchain needs; v1 predates it
        with:
          level: publish
    timeout-minutes: 15
name: Validate
on:
  pull_request: {}
  push:
    branches: [main]
permissions: {}
