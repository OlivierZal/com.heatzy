# Calls the family's reusable CI (Homey-runtime coverage leg).
jobs:
  ci:
    permissions:
      contents: read
      packages: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    uses: OlivierZal/configs/.github/workflows/reusable-ci.yml@dd730be20712cee23726f2f9da9403d9f79694e2 # v4.2.1
    with:
      check-node-version: '22'
      # The fleet's floor, measured on-device (2026-08): 22.20 on a Pro
      # 2019, 22.23 on a Pro 2023. `22` resolves to the head of the line
      # and drifts off that floor, so the coverage/Sonar leg names the
      # minor itself and carries its own flag. The quotes are
      # load-bearing: unquoted, `22.20` is JSON for the number 22.2, and
      # the leg would name itself after it.
      node-versions: '[{"node-version": "22"}, {"node-version": "22.20", "coverage": true}, {"node-version": "latest"}, {"node-version": "lts/*"}]'
name: CI
on:
  pull_request: {}
  push:
    branches: [main]
permissions: {}
