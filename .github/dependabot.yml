updates:
  # Both ecosystems share the `build(deps)` type: it keeps every bump under
  # one `git log --grep` and leaves `ci` to mean hand-written CI changes.
  # The prefix is pinned rather than left to Dependabot, which otherwise
  # infers it from each repo's history and lands a different one per repo.
  # The case of the subject's first word cannot be pinned (`commit-message`
  # takes `prefix`, `prefix-development` and `include` only) and follows
  # that history: `Bump` in api-core and melcloud-api, `bump` elsewhere.
  - commit-message:
      prefix: build(deps)
    cooldown:
      default-days: 7
    directory: /
    groups:
      actions:
        patterns:
          - '*'
    # One version covers both channels of @olivierzal/configs and of
    # @olivierzal/homey-kit, the npm pin and the workflow refs, and the
    # pin check enforces it. Only the npm channel is driven here: a
    # workflow-ref bump on its own would face that check against an npm
    # pin that has not moved, and each of the two pull requests would
    # block the other. The adoption moves the pin and the refs together.
    ignore:
      - dependency-name: OlivierZal/configs
      - dependency-name: OlivierZal/homey-kit
    package-ecosystem: github-actions
    schedule:
      interval: weekly
  - commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    cooldown:
      default-days: 7
    directory: /
    groups:
      eslint:
        patterns:
          - '@eslint/*'
          - '@stylistic/*'
          - eslint
          - eslint-*
          - typescript-eslint
      minor-and-patch:
        exclude-patterns:
          - '@eslint/*'
          - '@stylistic/*'
          - '@vitest/*'
          - eslint
          - eslint-*
          - typescript-eslint
          - vitest
        update-types:
          - minor
          - patch
      vitest:
        patterns:
          - '@vitest/*'
          - vitest
    # The adoption of @olivierzal/configs moves eslint with it: the rule
    # tables are audited against one minor, and a minor merged here first
    # runs unread. Its patches still come through.
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    # The private `@olivierzal` packages need no registry entry and no
    # secret: Dependabot reads GitHub Packages with its own token, under
    # the access each package grants this repository (its "Manage
    # Actions access"), the one the CI's install already rides.
    package-ecosystem: npm
    schedule:
      interval: weekly
version: 2
